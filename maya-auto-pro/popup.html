<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Maya Auto PRO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h2>🚀 Maya Auto Ocorrências</h2>
  <p class="subtitle">Automatize o cadastro com GPT e envio rápido para o Maya.</p>
</header>

<section class="card">
  <label>👷 Operador</label>
  <select id="operador"></select>

  <label>🚜 Máquina</label>
  <select id="maquina"></select>
</section>

<section class="card">
  <label>📋 Texto do Relatório</label>
  <textarea id="texto" placeholder="Cole o relatório aqui..."></textarea>
</section>

<div class="button-group">
  <button id="btnLaunch" class="secondary">🌐 Abrir Maya</button>
  <button id="btnGPT">🧠 Pensar com GPT</button>
  <button id="btnCadastrar" class="danger">✅ Cadastrar Automático</button>
</div>

<div id="status" class="status">Pronto para começar.</div>

<script src="gpt.js"></script>
<script src="popup.js"></script>

</body>
</html>
